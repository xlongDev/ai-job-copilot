name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 用绝对路径：standalone 产物的 cwd 与仓库根不同，相对路径会解析到别处
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
      # 构建期会被内联进 Edge(proxy) bundle，部署时必须与运行期保持一致
      AUTH_SECRET: "ci-${{ github.run_id }}-${{ github.run_attempt }}-not-for-production"
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm db:generate
          pnpm db:push
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
