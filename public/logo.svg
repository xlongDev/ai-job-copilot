<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <!-- Inner glow ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <!-- AI Sparkle / Star icon -->
  <g filter="url(#glow)">
    <!-- Main 4-point star -->
    <path d="M32 12 L36 28 L52 32 L36 36 L32 52 L28 36 L12 32 L28 28 Z" fill="url(#spark)"/>
    <!-- Small accent star top-right -->
    <path d="M46 14 L47.5 18.5 L52 20 L47.5 21.5 L46 26 L44.5 21.5 L40 20 L44.5 18.5 Z" fill="#ffffff" fill-opacity="0.8"/>
    <!-- Small accent dot bottom-left -->
    <circle cx="18" cy="46" r="2.5" fill="#ffffff" fill-opacity="0.6"/>
  </g>
</svg>
